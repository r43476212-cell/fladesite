
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Первоначальная настройка — FLADE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #f4f4f4; color: #171717;
      font: 16px Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; padding: 28px;
      background: white; border-radius: 16px;
      box-shadow: 0 8px 35px #00000012;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #666; line-height: 1.5; }
    label { display: block; margin-top: 17px; font-weight: 600; }
    input {
      width: 100%; margin-top: 7px; padding: 12px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 24px; padding: 14px;
      border: 0; border-radius: 8px; background: #e52b32;
      color: white; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>FLADE — настройка владельца</h1>
  <p>Создай первый аккаунт для управления магазином. Не передавай секрет и пароль другим людям.</p>

  <form id="setup">
    <label for="secret">Секрет первоначальной настройки</label>
    <input id="secret" type="password" autocomplete="off" required>

    <label for="username">Логин владельца</label>
    <input id="username" minlength="3" maxlength="32"
      pattern="[A-Za-zА-Яа-яЁё0-9_-]+" required>

    <label for="password">Пароль (не менее 12 символов)</label>
    <input id="password" type="password" minlength="12" maxlength="200"
      autocomplete="new-password" required>

    <button id="submit" type="submit">Создать аккаунт владельца</button>
  </form>
  <p id="result" role="status"></p>
</main>

<script>
const form = document.getElementById("setup");
const button = document.getElementById("submit");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  result.textContent = "Создаём аккаунт…";

  try {
    const response = await fetch("/api/setup-owner", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + document.getElementById("secret").value
      },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Не удалось создать аккаунт");
    }

    form.reset();
    result.textContent =
      "Аккаунт владельца создан! Логин: " + data.username +
      ". Теперь удали секрет BOOTSTRAP_SECRET из Worker и перейди в админ-панель.";
  } catch (error) {
    result.textContent = error.message || "Ошибка соединения. Попробуй ещё раз.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
